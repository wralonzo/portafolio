<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="128" height="128" rx="32" fill="url(#faviconGradient)" />
  
  <!-- Outer Ring Accent -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3" />

  <!-- Monogram WA / Code Brackets -->
  <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- W character -->
    <path d="M 28 40 L 42 88 L 56 56 L 70 88 L 84 40" />
    <!-- Terminal Slash / Bracket -->
    <path d="M 98 44 L 88 84" stroke="#F472B6" stroke-width="8" />
  </g>

  <!-- Green Online Dot -->
  <circle cx="100" cy="96" r="8" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" />
</svg>
